// RuneLite external plugin build, following the same shape as RuneLite's
// own plugin-hub example-plugin template: the client jar is `compileOnly`
// (the real RuneLite client provides it at runtime -- bundling it would
// just bloat the plugin and risk classpath conflicts), and everything
// else needed to actually run/test the plugin standalone during
// development comes in as `testImplementation` from the client's own
// annotationProcessor/test dependencies.
plugins {
    id 'java'
}

def runeLiteVersion = 'latest.release'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '4.11.0'

    // LWJGL natives for every platform, matching exactly what RuneLite's
    // own runelite-client/build.gradle.kts does (see its `for (platform
    // in listOf(...))` block) -- the client artifact we depend on above
    // doesn't propagate these as transitive dependencies on its own,
    // which is why `./gradlew run` failed outright without this (it
    // tried to resolve a single hardcoded classifier instead of picking
    // one for the actual host). Declaring all seven, same as upstream,
    // means this works on whatever platform runs it rather than only
    // the one that happened to write this block.
    def lwjglVersion = '3.3.2'
    for (platform in ['linux', 'linux-arm64', 'macos', 'macos-arm64', 'windows-x86', 'windows', 'windows-arm64']) {
        testRuntimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-${platform}"
        testRuntimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-${platform}"
    }
}

test {
    useJUnit()
}

// Lets `./gradlew run` launch a local RuneLite client with this plugin
// loaded, the same way RuneLite's own example-plugin does -- the
// fastest inner loop for testing against a real (or dev-mode) account
// without going through the plugin hub at all.
//
// Launching `net.runelite.client.RuneLite` directly here would start a
// perfectly normal client that silently never loads MyscapePlugin: core
// plugins are found by scanning the net.runelite.client.plugins package
// specifically, and developer-mode's other discovery path only picks up
// .jar files dropped in a sideloaded-plugins directory -- neither one
// looks at arbitrary classpath entries like our io.myscape.plugin
// classes. MyscapePluginTest (src/test/java/io/myscape/plugin) is the
// actual entry point: it calls ExternalPluginManager.loadBuiltin(...)
// to register our plugin class before handing off to RuneLite.main(),
// exactly like ExamplePluginTest does in RuneLite's own example-plugin.
task run(type: JavaExec) {
    mainClass = 'io.myscape.plugin.MyscapePluginTest'
    classpath = sourceSets.test.runtimeClasspath
    args = ['--developer-mode']
    // RuneLite's own startup code refuses to run in developer mode
    // without Java assertions enabled ("Developers should enable
    // assertions; Add -ea to your JVM arguments") -- it's a deliberate
    // safety check, not a bug, so satisfy it rather than working around
    // it.
    jvmArgs = ['-ea']
    // On macOS, RuneLite's fullscreen handling (OSXFullScreenAdapter)
    // reaches into com.apple.eawt/sun.awt, which the JVM's module
    // system hides from unnamed-module code by default -- the real
    // RuneLite launcher opens both explicitly for exactly this reason
    // (see runelite/launcher's packr/macos-*-config.json). compileOnly
    // client, sun.awt, com.apple.eawt exist only on macOS JDKs, so this
    // is scoped to macOS rather than added unconditionally.
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs += [
            '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.awt=ALL-UNNAMED'
        ]
    }
}
